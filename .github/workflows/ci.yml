name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-gcc14,   os: ubuntu-24.04,     cc: gcc-14,   cxx: g++-14, sweep: true }
          - { name: linux-x64-clang19, os: ubuntu-24.04,     cc: clang-19, cxx: clang++-19 }
          - { name: linux-arm64-gcc14, os: ubuntu-24.04-arm, cc: gcc-14,   cxx: g++-14 }
          # macOS: the runtime is built for 10.15 (CMakeLists.txt's default), the tools for 13.3, on Apple Silicon and Intel.
          - { name: macos-arm64,       os: macos-latest }
          - { name: macos-x64,         os: macos-15-intel }
          - { name: windows-x64,       os: windows-2022 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # GCC 14's libstdc++ provides <print>; Clang on Linux uses it too.
      - name: Install compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-14 ${{ startsWith(matrix.cc, 'clang') && matrix.cc || '' }} ${{ matrix.sweep && 'binutils-powerpc-linux-gnu' || '' }}
      - name: Configure
        shell: bash
        run: |
          args=()
          if [ -n "${{ matrix.cxx }}" ]; then
            args+=(-DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQILIN_WERROR=ON "${args[@]}"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # The PPU decoder against GNU objdump over a sweep of the encoding space (no game files needed).
      - name: Decoder sweep
        if: matrix.sweep
        run: python3 tools/check/verify_decoder.py --qilin build/qilin --sweep
      # The SPU decoder's reference: binutils dropped the SPU after 2.3x, so its
      # objdump is built from the GNU source (pinned by hash, kept in a cache).
      - name: SPU binutils (cached)
        if: matrix.sweep
        id: spu-binutils
        uses: actions/cache@v4
        with:
          path: ~/spu-binutils
          key: spu-binutils-2.31.1-${{ runner.os }}-${{ runner.arch }}-1
      - name: SPU binutils (build)
        if: matrix.sweep && steps.spu-binutils.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o binutils.tar.xz https://ftp.gnu.org/gnu/binutils/binutils-2.31.1.tar.xz
          echo "5d20086ecf5752cc7d9134246e9588fa201740d540f7eb84d795b1f7a93bca86  binutils.tar.xz" | sha256sum -c
          tar xf binutils.tar.xz
          cd binutils-2.31.1
          ./configure --target=spu-elf --prefix="$HOME/spu-binutils" --disable-nls --disable-werror > /dev/null
          make -j4 all-binutils MAKEINFO=true > /dev/null
          make install-binutils MAKEINFO=true > /dev/null
      - name: SPU decoder sweep
        if: matrix.sweep
        run: OBJDUMP_SPU="$HOME/spu-binutils/bin/spu-elf-objdump" python3 tools/check/verify_spu_decoder.py --qilin build/qilin --sweep
      - name: Scripts compile
        if: matrix.sweep
        run: python3 -m py_compile tools/check/verify_decoder.py tools/check/verify_spu_decoder.py
